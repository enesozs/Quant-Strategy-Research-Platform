<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Backtest, compare, optimize and validate systematic trading strategies."
    />
    <title>Strategy Lab</title>
    <script>
      // Apply the theme before first paint to avoid a flash: stored choice, else OS preference
      // (dark unless the OS asks for light).
      ;(function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('strategy-lab-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        } catch (e) {}
        var root = document.documentElement
        if (theme === 'dark') root.classList.add('dark')
        root.dataset.theme = theme
        root.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
